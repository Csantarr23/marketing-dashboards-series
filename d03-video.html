<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D03 — Un video, todo el embudo</title>
<style>
:root {
  --c-bg:      #08080F;
  --c-accent:  #FF4B14;
  --c-white:   #F5F5F7;
  --c-surface: #13131E;
  --c-muted:   #4A4A62;
  --c-rule:    #1F1F30;
  --c-frio:    #5B8CFF;
  --c-tibio:   #F59E0B;
  --c-cac:     #22D3AA;
  --font-d: 'Impact', 'Arial Black', 'Franklin Gothic Heavy', 'Arial', sans-serif;
  --font-s: 'Helvetica Neue', 'Segoe UI', 'Arial', sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

#canvas {
  width: 1080px; height: 1920px;
  overflow: hidden;
  background: var(--c-bg); color: var(--c-white);
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 112px 88px 100px;
  transform-origin: top left;
  position: absolute; top: 0; left: 0;
}

.appear { opacity: 0; transform: translateY(20px); }
.rule   { width: 100%; height: 1px; background: var(--c-rule); }

/* ── Header ──────────────────────────────────────────── */
.hdr { display: flex; flex-direction: column; gap: 22px; }
.hdr__tag {
  font-family: var(--font-s);
  font-size: 25px; font-weight: 600;
  letter-spacing: .28em; text-transform: uppercase;
  color: var(--c-muted);
}

/* ── Bad section ─────────────────────────────────────── */
.section-bad { display: flex; flex-direction: column; gap: 16px; }
.section-label {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-s);
  font-size: 15px; font-weight: 700;
  letter-spacing: .26em; text-transform: uppercase;
}
.section-label--bad  { color: #7A2A2A; }

.bad-callout {
  border-left: 2px solid #5A1A1A;
  padding: 10px 0 10px 18px;
}
.bad-callout__text {
  font-family: var(--font-s);
  font-size: 17px; font-weight: 400;
  line-height: 1.5; color: #5A3A3A;
}

/* ── VS Divider ──────────────────────────────────────── */
.vs-divider {
  display: flex; align-items: center; gap: 20px;
}
.vs-divider__line { flex: 1; height: 1px; background: #1A1A2A; }
.vs-divider__text {
  font-family: var(--font-d);
  font-size: 38px; font-weight: 900;
  letter-spacing: .12em; color: var(--c-accent);
  text-shadow: 0 0 20px rgba(255,75,20,.6), 0 0 44px rgba(255,75,20,.2);
}

/* ── CAC bar ─────────────────────────────────────────── */
.cac { display: flex; flex-direction: column; gap: 12px; }
.cac__header {
  display: flex; align-items: center; gap: 10px;
}
.cac__title {
  font-family: var(--font-s);
  font-size: 13px; font-weight: 700;
  letter-spacing: .3em; text-transform: uppercase;
  color: var(--c-cac);
}
.cac__bar-track {
  width: 100%; height: 10px;
  background: #0D1A18; border-radius: 6px; overflow: hidden;
}
.cac__bar-fill {
  height: 100%; width: 0%;
  background: var(--c-cac);
  border-radius: 6px;
  box-shadow: 0 0 12px rgba(34,211,170,.5);
  transition: width 1.4s cubic-bezier(.25,.8,.25,1);
}
.cac__note {
  font-family: var(--font-s);
  font-size: 16px; color: rgba(34,211,170,.55);
  letter-spacing: .06em;
}

/* ── Footer ──────────────────────────────────────────── */
.ftr { display: flex; flex-direction: column; gap: 22px; }
.ftr__label {
  font-family: var(--font-s);
  font-size: 19px; font-weight: 400;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--c-muted); text-align: center;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes tvPulse {
  0%,100% { filter: drop-shadow(0 0 10px rgba(255,75,20,.3)); }
  50%      { filter: drop-shadow(0 0 28px rgba(255,75,20,.75)) drop-shadow(0 0 56px rgba(255,75,20,.2)); }
}
@media (prefers-reduced-motion: reduce) {
  .appear { opacity: 1 !important; transform: none !important; }
  * { animation-duration: 1ms !important; }
}
</style>
</head>
<body>
<div id="canvas">

<!-- Header -->
<div class="hdr appear" id="a-hdr">
  <span class="hdr__tag">Un video, todo el embudo</span>
  <div class="rule"></div>
</div>

<!-- Bad section: TOF/MOF/BOF -->
<div class="section-bad appear" id="a-bad">
  <div class="section-label section-label--bad">
    <span>✕&nbsp; Lo que hacen todos</span>
  </div>

  <svg viewBox="0 0 904 248" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">

    <!-- Stage badge TOF -->
    <rect x="0"   y="4" width="264" height="88" rx="10" fill="#0E0E20" stroke="#4040888" stroke-width="1.2"/>
    <rect x="0"   y="4" width="264" height="88" rx="10" fill="#0E0E20" stroke="#404088" stroke-width="1.2"/>
    <text x="132" y="38" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="26" fill="#C0C0E8" letter-spacing="3">TOF</text>
    <text x="132" y="60" text-anchor="middle" font-family="Helvetica Neue,Segoe UI,Arial,sans-serif" font-size="11" fill="#7878A8" letter-spacing="2">TOP OF FUNNEL</text>
    <!-- Anuncio #1 box -->
    <rect x="16"  y="114" width="232" height="126" rx="8" fill="#0A0C1C" stroke="#3050B0" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="132" y="160" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="19" fill="#A0B4E8" letter-spacing="2">ANUNCIO #1</text>
    <text x="132" y="182" text-anchor="middle" font-family="Helvetica Neue,Segoe UI,Arial,sans-serif" font-size="11" fill="#505080" letter-spacing="1">solo para awareness</text>
    <!-- Connector -->
    <line x1="132" y1="92" x2="132" y2="114" stroke="#303060" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Stage badge MOF -->
    <rect x="320" y="4" width="264" height="88" rx="10" fill="#0E0E20" stroke="#404088" stroke-width="1.2"/>
    <text x="452" y="38" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="26" fill="#C0C0E8" letter-spacing="3">MOF</text>
    <text x="452" y="60" text-anchor="middle" font-family="Helvetica Neue,Segoe UI,Arial,sans-serif" font-size="11" fill="#7878A8" letter-spacing="2">MID OF FUNNEL</text>
    <!-- Anuncio #2 box -->
    <rect x="336" y="114" width="232" height="126" rx="8" fill="#130E04" stroke="#907020" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="452" y="160" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="19" fill="#D4B850" letter-spacing="2">ANUNCIO #2</text>
    <text x="452" y="182" text-anchor="middle" font-family="Helvetica Neue,Segoe UI,Arial,sans-serif" font-size="11" fill="#706030" letter-spacing="1">solo para consideración</text>
    <!-- Connector -->
    <line x1="452" y1="92" x2="452" y2="114" stroke="#504510" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Arrow MOF → BOF -->
    <line x1="584" y1="48" x2="638" y2="48" stroke="#5050A0" stroke-width="1.5"/>
    <polygon points="632,43 642,48 632,53" fill="#5050A0"/>

    <!-- Stage badge BOF -->
    <rect x="640" y="4" width="264" height="88" rx="10" fill="#0E0E20" stroke="#404088" stroke-width="1.2"/>
    <text x="772" y="38" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="26" fill="#C0C0E8" letter-spacing="3">BOF</text>
    <text x="772" y="60" text-anchor="middle" font-family="Helvetica Neue,Segoe UI,Arial,sans-serif" font-size="11" fill="#7878A8" letter-spacing="2">BOT OF FUNNEL</text>
    <!-- Anuncio #3 box -->
    <rect x="656" y="114" width="232" height="126" rx="8" fill="#130806" stroke="#903828" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="772" y="160" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="19" fill="#D07060" letter-spacing="2">ANUNCIO #3</text>
    <text x="772" y="182" text-anchor="middle" font-family="Helvetica Neue,Segoe UI,Arial,sans-serif" font-size="11" fill="#603028" letter-spacing="1">solo para conversión</text>
    <!-- Connector -->
    <line x1="772" y1="92" x2="772" y2="114" stroke="#503020" stroke-width="1.2" stroke-dasharray="3 3"/>

  </svg>

  <div class="bad-callout">
    <p class="bad-callout__text">
      3 videos distintos · 3 presupuestos · 3 veces el trabajo.<br>
      Y el algoritmo no aprende de ninguno.
    </p>
  </div>
</div>

<!-- VS Divider -->
<div class="vs-divider appear" id="a-vs">
  <div class="vs-divider__line"></div>
  <span class="vs-divider__text">VS</span>
  <div class="vs-divider__line"></div>
</div>

<!-- Good section: Un video → 3 audiencias -->
<svg id="a-diagram" viewBox="0 0 904 450" style="width:100%;display:block;opacity:0" xmlns="http://www.w3.org/2000/svg">

  <!-- Micro-label -->
  <text x="452" y="14" text-anchor="middle"
    font-family="Helvetica Neue,Segoe UI,Arial,sans-serif"
    font-size="13" font-weight="700" fill="#22D3AA" letter-spacing="3">✓  LA SOLUCIÓN</text>

  <!-- TU VIDEO block -->
  <rect id="tv-rect" x="177" y="22" width="550" height="146" rx="14"
    fill="#130D08" stroke="#FF4B14" stroke-width="2.5"
    filter="url(#glow)"/>
  <text x="452" y="86" text-anchor="middle"
    font-family="Impact,Arial Black,sans-serif"
    font-size="44" font-weight="900" fill="#FF4B14" letter-spacing="4">TU VIDEO</text>
  <text x="452" y="114" text-anchor="middle"
    font-family="Helvetica Neue,Segoe UI,Arial,sans-serif"
    font-size="14" fill="rgba(255,75,20,.55)" letter-spacing="3">UN SOLO CREATIVO · TRES AUDIENCIAS</text>

  <defs>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base branches (gray, always visible dimly) -->
  <path id="base-frio"    d="M452,168 C452,218 130,228 130,270" fill="none" stroke="#1C1C2C" stroke-width="2"/>
  <path id="base-tibio"   d="M452,168 L452,270"                  fill="none" stroke="#1C1C2C" stroke-width="2"/>
  <path id="base-cal"     d="M452,168 C452,218 774,228 774,270" fill="none" stroke="#1C1C2C" stroke-width="2"/>

  <!-- Lit branches (animated) -->
  <path id="branch-frio"  d="M452,168 C452,218 130,228 130,270"  fill="none" stroke="#5B8CFF" stroke-width="2.5" stroke-linecap="round" style="opacity:0"/>
  <path id="branch-tibio" d="M452,168 L452,270"                   fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" style="opacity:0"/>
  <path id="branch-cal"   d="M452,168 C452,218 774,228 774,270"  fill="none" stroke="#FF4B14" stroke-width="2.5" stroke-linecap="round" style="opacity:0"/>

  <!-- Arrowheads -->
  <polygon id="arr-frio"  points="124,265 136,265 130,274" fill="#5B8CFF"  style="opacity:0"/>
  <polygon id="arr-tibio" points="446,265 458,265 452,274" fill="#F59E0B"  style="opacity:0"/>
  <polygon id="arr-cal"   points="768,265 780,265 774,274" fill="#FF4B14"  style="opacity:0"/>

  <!-- FRÍO node -->
  <g id="node-frio" style="opacity:0">
    <rect x="0"   y="270" width="260" height="168" rx="12" fill="#090D1E" stroke="#2A3E7A" stroke-width="1.5"/>
    <text x="130" y="316" text-anchor="middle"
      font-family="Impact,Arial Black,sans-serif"
      font-size="28" fill="#5B8CFF" letter-spacing="4">FRÍO</text>
    <text x="130" y="342" text-anchor="middle"
      font-family="Helvetica Neue,Segoe UI,Arial,sans-serif"
      font-size="11" fill="rgba(91,140,255,.5)" letter-spacing="2">TRÁFICO NUEVO</text>
    <text x="130" y="376" text-anchor="middle"
      font-family="Helvetica Neue,Segoe UI,Arial,sans-serif"
      font-size="13" fill="#3A4A72" letter-spacing="1">Awareness · CPM bajo</text>
    <text x="130" y="400" text-anchor="middle"
      font-family="Helvetica Neue,Segoe UI,Arial,sans-serif"
      font-size="13" fill="#3A4A72" letter-spacing="1">Intereses similares</text>
  </g>

  <!-- TIBIO node -->
  <g id="node-tibio" style="opacity:0">
    <rect x="322" y="270" width="260" height="168" rx="12" fill="#160F04" stroke="#7A5A0A" stroke-width="1.5"/>
    <text x="452" y="316" text-anchor="middle"
      font-family="Impact,Arial Black,sans-serif"
      font-size="28" fill="#F59E0B" letter-spacing="4">TIBIO</text>
    <text x="452" y="342" text-anchor="middle"

      font-size="13" fill="#6A5020" letter-spacing="1">Consideración · CTR alto</text>
    <text x="452" y="400" text-anchor="middle"
      font-family="Helvetica Neue,Segoe UI,Arial,sans-serif"
      font-size="13" fill="#6A5020" letter-spacing="1">Vistas · Interacción</text>
  </g>

  <!-- CALIENTE node -->
  <g id="node-cal" style="opacity:0">
    <rect x="644" y="270" width="260" height="168" rx="12" fill="#130A06" stroke="#FF4B14" stroke-width="1.5"
      style="filter:drop-shadow(0 0 8px rgba(255,75,20,.2))"/>
    <text x="774" y="316" text-anchor="middle"
      font-family="Impact,Arial Black,sans-serif"
      font-size="22" fill="#FF4B14" letter-spacing="2">CALIENTE</text>
    <text x="774" y="342" text-anchor="middle"
      font-family="Helvetica Neue,Segoe UI,Arial,sans-serif"
      font-size="11" fill="rgba(255,75,20,.5)" letter-spacing="2">REMARKETING</text>
    <text x="774" y="376" text-anchor="middle"
      font-family="Helvetica Neue,Segoe UI,Arial,sans-serif"
      font-size="13" fill="#603020" letter-spacing="1">Conversión · ROAS máx.</text>
    <text x="774" y="400" text-anchor="middle"
      font-family="Helvetica Neue,Segoe UI,Arial,sans-serif"
      font-size="13" fill="#603020" letter-spacing="1">Visitantes · Carrito</text>
  </g>

</svg>

<!-- CAC bar -->
<div class="cac appear" id="a-cac">
  <div class="cac__header">
    <span class="cac__title">CAC estable · El algoritmo aprende de uno solo</span>
  </div>
  <div class="cac__bar-track">
    <div class="cac__bar-fill" id="cac-bar"></div>
  </div>
  <div class="cac__note">Más señal de conversión · menos gasto desperdiciado</div>
</div>

<!-- Footer -->
<div class="ftr appear" id="a-ftr">
  <div class="rule"></div>
  <span class="ftr__label">Estructura primero &nbsp;·&nbsp; Creativos después</span>
</div>

</div>

<script>
/* ╔═══════════════════════════════════════════════════════╗
   ║  CONSTANTES EDITABLES — Dashboard 03                 ║
   ╚═══════════════════════════════════════════════════════╝ */

const CIFRAS = {
  cac_pct: 80,
};

const TIMINGS = {
  hdr:          80,
  bad_section:  280,
  vs:           1200,
  diagram:      1500,   // SVG good section
  tv_appear:    1660,
  tv_pulse:     2000,
  branch_frio:  2200,
  node_frio:    2440,
  branch_tibio: 2680,
  node_tibio:   2880,
  branch_cal:   3100,
  node_cal:     3300,
  cac_appear:   3560,
  cac_fill:     3720,
  ftr:          4100,
};

const D_BRANCH = 320; // ms duration per branch draw

const $ = id => document.getElementById(id);
function at(ms, fn) { setTimeout(fn, ms); }

function reveal(id) {
  const el = $(id); if (!el) return;
  el.style.animation = 'fadeUp .48s cubic-bezier(.22,.68,0,1.2) forwards';
}

function svgFade(ids, dur) {
  ids.forEach(id => {
    const el = $(id); if (!el) return;
    el.style.transition = 'opacity ' + dur + 'ms ease';
    requestAnimationFrame(() => requestAnimationFrame(() => el.style.opacity = '1'));
  });
}

function drawPath(id, dur) {
  const el = $(id); if (!el) return;
  const len = el.getTotalLength ? el.getTotalLength() : 280;
  el.style.strokeDasharray  = len;
  el.style.strokeDashoffset = len;
  el.style.opacity = '1';
  el.style.transition = 'stroke-dashoffset ' + dur + 'ms cubic-bezier(.4,0,.2,1)';
  requestAnimationFrame(() => requestAnimationFrame(() => el.style.strokeDashoffset = '0'));
}

/* ── Secuencia ────────────────────────────────────────── */
reveal('a-hdr');
at(TIMINGS.bad_section, () => reveal('a-bad'));
at(TIMINGS.vs,          () => reveal('a-vs'));

/* Good diagram */
at(TIMINGS.diagram, () => {
  const el = $('a-diagram');
  el.style.transition = 'opacity 0.4s ease';
  el.style.opacity = '1';
});

/* TV pulse */
at(TIMINGS.tv_pulse, () => {
  const el = $('tv-rect');
  el.style.animation = 'tvPulse 0.8s ease-in-out';
  el.addEventListener('animationend', () => { el.style.animation = ''; }, { once: true });
});

/* FRÍO */
at(TIMINGS.branch_frio,  () => drawPath('branch-frio', D_BRANCH));
at(TIMINGS.node_frio,    () => { svgFade(['arr-frio'], 250); svgFade(['node-frio'], 400); });

/* TIBIO */
at(TIMINGS.branch_tibio, () => drawPath('branch-tibio', D_BRANCH));
at(TIMINGS.node_tibio,   () => { svgFade(['arr-tibio'], 250); svgFade(['node-tibio'], 400); });

/* CALIENTE */
at(TIMINGS.branch_cal,   () => drawPath('branch-cal', D_BRANCH));
at(TIMINGS.node_cal,     () => { svgFade(['arr-cal'], 250); svgFade(['node-cal'], 400); });

/* CAC */
at(TIMINGS.cac_appear, () => reveal('a-cac'));
at(TIMINGS.cac_fill,   () => {
  const bar = $('cac-bar');
  bar.style.width = CIFRAS.cac_pct + '%';
});

at(TIMINGS.ftr, () => reveal('a-ftr'));
</script>

<script>
(function () {
  const c = document.getElementById('canvas');
  function fit() {
    const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    c.style.transform = 'scale(' + s + ')';
    c.style.left = ((window.innerWidth  - 1080 * s) / 2) + 'px';
    c.style.top  = ((window.innerHeight - 1920 * s) / 2) + 'px';
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
